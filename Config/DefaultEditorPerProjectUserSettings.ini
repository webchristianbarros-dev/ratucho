; ============================================================================
; Unreal MCP (plugin nativo Epic - ModelContextProtocol, experimental)
; Endpoint: http://127.0.0.1:8000/mcp  (somente localhost)
; bEnableToolSearch=True -> o Claude descobre os toolsets sob demanda
; (list_toolsets / describe_toolset / call_tool), economizando contexto.
; ============================================================================
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
bEnableToolSearch=True

[/Script/UnrealEd.EditorPerformanceSettings]
; Reduz uso de CPU/GPU quando o editor nao esta em foco (ex.: usando o Blender)
bThrottleCPUWhenNotForeground=True
bMonitorEditorPerformance=True

[/Script/UnrealEd.EditorLoadingSavingSettings]
bMonitorContentDirectories=True
bAutoSaveEnable=True
AutoSaveTimeMinutes=10
bForceCompilationAtStartup=False
