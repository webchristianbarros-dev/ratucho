; ============================================================================
; Ratucho - DefaultEngine.ini
; Perfil de hardware alvo de desenvolvimento: GTX 1050 Ti 4 GB / i7-7700HQ / 32 GB
; Ver docs/HARDWARE.md antes de alterar estas opcoes.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Ratucho.RatuchoGameMode
GameDefaultMap=/Game/Ratucho/Maps/L_MainMenu.L_MainMenu
EditorStartupMap=/Game/Ratucho/Maps/Levels/L_Cozinha.L_Cozinha
TransitionMap=
+GameModeMapPrefixes=(Name="L_MainMenu",GameMode="/Script/Ratucho.RatuchoMenuGameMode")

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False

[/Script/NavigationSystem.RecastNavMesh]
; Navmesh gerado em runtime no servidor (bots) e ajustado ao tamanho do rato.
RuntimeGeneration=Dynamic
AgentRadius=34.0
AgentHeight=80.0
AgentMaxStepHeight=40.0
AgentMaxSlope=50.0
CellSize=10.0
CellHeight=10.0
TileSizeUU=1600.0

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Iluminacao global / reflexos: Lumen DESLIGADO (pesado demais p/ 4 GB VRAM)
; 0 = None (usar luz estatica/baked ou SkyLight), 1 = Lumen, 2 = SSGI
r.DynamicGlobalIlluminationMethod=0
; 0 = None, 1 = Lumen, 2 = Screen Space Reflections
r.ReflectionMethod=2
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.AllowStaticLighting=True
; --- Sombras: Virtual Shadow Maps consome muita VRAM -> shadow maps classicos
r.Shadow.Virtual.Enable=0
; --- Distance fields so sao necessarios p/ Lumen software / DFAO
r.GenerateMeshDistanceFields=False
; --- Virtual texturing desligado (reduz custo de memoria/compilacao)
r.VirtualTextures=False
; --- Anti-aliasing: TAA (2) e mais barato que TSR (4)
r.AntiAliasingMethod=2
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.CustomDepth=1
; --- Nanite permanece disponivel, mas nao deve ser base do pipeline de arte
r.Nanite.ProjectEnabled=True

[SystemSettings]
; Pool de streaming de texturas (MB) - deixa folga na VRAM de 4 GB
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1

[SystemSettingsEditor]
r.Streaming.PoolSize=1200

[DevOptions.Shaders]
; i7-7700HQ = 4 nucleos / 8 threads. Reserva 2 threads para o editor nao travar
; durante compilacao de shaders.
NumUnusedShaderCompilingThreads=2
NumUnusedShaderCompilingThreadsDuringGame=4
WorkerProcessPriority=-1

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
bAllowNetworkConnection=True
SecurityToken=421BBEF34A860D87617833B459F9E2E5
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

